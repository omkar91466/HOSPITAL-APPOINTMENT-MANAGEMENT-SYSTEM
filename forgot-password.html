<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | CarePoint</title>
  <link rel="stylesheet" href="css/style.css?v=2">
  <link rel="stylesheet" href="css/login.css?v=2">
</head>
<body class="auth-page">
  <a class="auth-brand brand" href="index.html"><img src="images/logo.png" alt=""><span>CarePoint</span></a>
  <main class="auth-layout single-panel-layout">
    <section class="auth-intro"><p class="eyebrow">ACCOUNT SUPPORT</p><h1>Let’s get you back to your care.</h1><p>Enter the email address connected to your CarePoint account.</p></section>
    <section class="auth-panel">
      <p class="eyebrow">RESET PASSWORD</p><h2>Forgot your password?</h2>
      <p class="panel-copy">Enter your email and choose a new password to access CarePoint again.</p>
      <form action="php/forgot-password.php" method="post" novalidate>
        <label for="resetEmail">Email address</label>
        <input id="resetEmail" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
        <label for="resetPassword">New password</label>
        <input id="resetPassword" name="password" type="password" minlength="6" required placeholder="At least 6 characters">
        <label for="resetConfirmPassword">Confirm password</label>
        <input id="resetConfirmPassword" name="confirm_password" type="password" minlength="6" required placeholder="Re-enter your password">
        <p class="form-status" aria-live="polite"></p>
        <button class="button" type="submit">Update password</button>
      </form>
      <p class="auth-switch"><a href="login.html">Return to sign in</a></p>
    </section>
  </main>
  <script src="js/script.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
