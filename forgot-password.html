<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | CarePoint</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-page">
  <a class="auth-brand brand" href="index.html"><img src="images/logo.png" alt=""><span>CarePoint</span></a>
  <main class="auth-layout single-panel-layout">
    <section class="auth-intro"><p class="eyebrow">ACCOUNT SUPPORT</p><h1>Let’s get you back to your care.</h1><p>Enter the email address connected to your CarePoint account.</p></section>
    <section class="auth-panel">
      <p class="eyebrow">RESET PASSWORD</p><h2>Forgot your password?</h2>
      <p class="panel-copy">We will check your account and send reset instructions when email delivery is configured.</p>
      <form action="php/forgot-password.php" method="post"><label for="resetEmail">Email address</label><input id="resetEmail" name="email" type="email" autocomplete="email" required placeholder="you@example.com"><button class="button" type="submit">Request reset link</button></form>
      <p class="auth-switch"><a href="login.html">Return to sign in</a></p>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
