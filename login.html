<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient login | CarePoint</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/login.css"></head><body class="auth"><a class="brand" href="index.html"><span>✚</span> CarePoint</a><main><section class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Sign in to your care.</h1><form action="php/login.php" method="post"><label>Email address<input name="email" type="email" required placeholder="you@example.com"></label><label>Password<input name="password" type="password" required placeholder="••••••••"></label><button class="button">Sign in</button></form><p>New to CarePoint? <a href="#register" id="showRegister">Create an account</a></p></section><section class="auth-card hidden" id="register"><p class="eyebrow">NEW PATIENT</p><h1>Create your account.</h1><form action="php/register.php" method="post"><label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="6" required></label><button class="button">Create account</button></form></section></main><script src="js/login.js"></script></body></html>
